<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <title>تورتة فادج شوكولاتة بلجيكية - كاندي لوز</title>
  <defs>
    <linearGradient id="cake-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F8" />
      <stop offset="50%" stop-color="#FBD3DD" />
      <stop offset="100%" stop-color="#F6E0D2" />
    </linearGradient>
    <linearGradient id="choco-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3E2723" />
      <stop offset="50%" stop-color="#2B1A10" />
      <stop offset="100%" stop-color="#1B0000" />
    </linearGradient>
    <linearGradient id="choco-glaze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5D4037" />
      <stop offset="50%" stop-color="#3E2723" />
      <stop offset="100%" stop-color="#211009" />
    </linearGradient>
    <linearGradient id="gold-flake" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="50%" stop-color="#F5B041" />
      <stop offset="100%" stop-color="#B7770D" />
    </linearGradient>
    <filter id="cake-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2B1A10" flood-opacity="0.22" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#cake-bg)" />

  <!-- Pedestal Cake Stand -->
  <g filter="url(#cake-shadow)" transform="translate(300, 310)">
    <!-- Stand Base & Plate -->
    <ellipse cx="0" cy="120" rx="140" ry="24" fill="#E6DED8" />
    <path d="M-25,120 L-40,40 L40,40 L25,120 Z" fill="#FAF6EE" stroke="#E6DED8" stroke-width="2" />
    <ellipse cx="0" cy="40" rx="190" ry="34" fill="#FFFFFF" stroke="#E8A33D" stroke-width="3" />

    <!-- Cake Lower Tier -->
    <path d="M-135,10 C-135,45 135,45 135,10 L135,-65 C135,-30 -135,-30 -135,-65 Z" fill="url(#choco-dark)" />
    <!-- Cake Middle Ganache Layer Line -->
    <path d="M-135,-25 C-135,10 135,10 135,-25" stroke="#A31D56" stroke-width="4" fill="none" opacity="0.6" />

    <!-- Cake Top Surface -->
    <ellipse cx="0" cy="-65" rx="135" ry="32" fill="url(#choco-glaze)" stroke="#5D4037" stroke-width="2" />

    <!-- Dripping Glossy Ganache on sides -->
    <path d="M-135,-65 
             C-135,-40 -115,-30 -110,-48 
             C-105,-20 -85,-15 -80,-45 
             C-75,-10 -55,-5 -50,-50 
             C-45,-25 -25,-20 -20,-48 
             C-15,5 15,5 20,-48 
             C25,-20 45,-15 50,-45 
             C55,-10 75,-5 80,-50 
             C85,-20 105,-25 110,-48 
             C115,-30 135,-40 135,-65 
             C135,-30 -135,-30 -135,-65 Z" 
          fill="#1F0E08" />

    <!-- Hazelnut Praline & 24K Gold Leaf Toppings on Cake -->
    <!-- Chocolate curls / shavings -->
    <g transform="translate(0, -75)">
      <!-- Central Rosette / Truffle -->
      <circle cx="0" cy="0" r="18" fill="#1F0E08" stroke="#5D4037" stroke-width="2" />
      <circle cx="0" cy="0" r="10" fill="#A31D56" />

      <!-- Surrounding Truffles -->
      <circle cx="-50" cy="-6" r="13" fill="#1F0E08" stroke="#5D4037" stroke-width="1.5" />
      <circle cx="50" cy="-6" r="13" fill="#1F0E08" stroke="#5D4037" stroke-width="1.5" />
      <circle cx="-30" cy="12" r="12" fill="#1F0E08" stroke="#5D4037" stroke-width="1.5" />
      <circle cx="30" cy="12" r="12" fill="#1F0E08" stroke="#5D4037" stroke-width="1.5" />
      <circle cx="-80" cy="4" r="11" fill="#1F0E08" stroke="#5D4037" stroke-width="1.5" />
      <circle cx="80" cy="4" r="11" fill="#1F0E08" stroke="#5D4037" stroke-width="1.5" />

      <!-- Hazelnut Crumbs / Gold leaf specs -->
      <polygon points="0,-16 4,-12 2,-8 -3,-10" fill="url(#gold-flake)" />
      <polygon points="-40,-14 -35,-18 -32,-12 -38,-10" fill="url(#gold-flake)" />
      <polygon points="45,-12 50,-16 52,-10 46,-8" fill="url(#gold-flake)" />
      <polygon points="-15,18 -10,14 -8,20 -14,22" fill="url(#gold-flake)" />
      <polygon points="20,16 26,18 24,24 18,20" fill="url(#gold-flake)" />
      <polygon points="65,10 70,8 72,14 66,16" fill="url(#gold-flake)" />
    </g>

    <!-- Sparkles -->
    <path d="M-150,-100 Q-150,-110 -160,-110 Q-150,-110 -150,-120 Q-150,-110 -140,-110 Q-150,-110 -150,-100 Z" fill="#E8A33D" />
    <path d="M150,-90 Q150,-98 142,-98 Q150,-98 150,-106 Q150,-98 158,-98 Q150,-98 150,-90 Z" fill="#E8A33D" />
  </g>

  <!-- Bottom Brand Pill -->
  <g transform="translate(300, 520)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#FFFFFF" stroke="#FED7E7" stroke-width="2" filter="url(#cake-shadow)" />
    <circle cx="-105" cy="0" r="14" fill="#A31D56" />
    <path d="M-109,-4 L-101,0 L-109,4 Z" fill="#FFFFFF" />
    <text x="-80" y="6" font-family="'El Messiri', 'IBM Plex Sans Arabic', sans-serif" font-weight="700" font-size="16" fill="#A31D56">كاندي لوز</text>
    <text x="5" y="5" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="600" font-size="12" fill="#E8A33D">تورتة فادج بلجيكية</text>
  </g>
</svg>