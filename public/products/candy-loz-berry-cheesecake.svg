<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <title>تشيز كيك التوت البري (بيري لوز) - كاندي لوز</title>
  <defs>
    <linearGradient id="bc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="60%" stop-color="#FBD3DD" />
      <stop offset="100%" stop-color="#FED7E7" />
    </linearGradient>
    <linearGradient id="crust-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5A65D" />
      <stop offset="100%" stop-color="#9C5E1B" />
    </linearGradient>
    <linearGradient id="cheese-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFF8E7" />
      <stop offset="100%" stop-color="#F6E7D2" />
    </linearGradient>
    <linearGradient id="berry-glaze" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D72D58" />
      <stop offset="50%" stop-color="#A31D56" />
      <stop offset="100%" stop-color="#6E0C36" />
    </linearGradient>
    <filter id="bc-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#A31D56" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bc-bg)" />

  <!-- Pedestal Plate -->
  <g filter="url(#bc-shadow)" transform="translate(300, 310)">
    <!-- Base Plate -->
    <ellipse cx="0" cy="50" rx="190" ry="34" fill="#FFFFFF" stroke="#FED7E7" stroke-width="3" />
    <ellipse cx="0" cy="46" rx="175" ry="30" fill="#FFF8FA" stroke="#E8A33D" stroke-width="1.5" stroke-dasharray="4 3" />

    <!-- Cheesecake Side Body -->
    <!-- Crust Layer (Bottom) -->
    <path d="M-130,20 C-130,48 130,48 130,20 L130,5 C130,33 -130,33 -130,5 Z" fill="url(#crust-grad)" />
    <!-- Cream Cheese Body (Middle) -->
    <path d="M-130,5 C-130,33 130,33 130,5 L130,-55 C130,-27 -130,-27 -130,-55 Z" fill="url(#cheese-grad)" />

    <!-- Cheesecake Top Surface -->
    <ellipse cx="0" cy="-55" rx="130" ry="28" fill="#FFF9ED" stroke="#F6E7D2" stroke-width="1.5" />

    <!-- Dripping Rich Berry Sauce on Top & Sides -->
    <path d="M-130,-55 
             C-130,-35 -118,-25 -112,-40 
             C-106,-15 -90,-10 -84,-38 
             C-78,-5 -62,0 -56,-42 
             C-50,-20 -35,-15 -28,-40 
             C-20,5 0,10 8,-38 
             C16,-15 32,-10 40,-40 
             C48,2 65,0 72,-42 
             C80,-15 96,-20 104,-38 
             C112,-25 130,-35 130,-55 
             C130,-27 -130,-27 -130,-55 Z" 
          fill="url(#berry-glaze)" />
    <ellipse cx="0" cy="-56" rx="126" ry="25" fill="url(#berry-glaze)" opacity="0.9" />

    <!-- Fresh Berry Crown on Top -->
    <g transform="translate(0, -68)">
      <!-- Strawberries / Raspberries -->
      <!-- Center Strawberry -->
      <path d="M0,-12 C12,-12 18,2 10,14 C4,22 -4,22 -10,14 C-18,2 -12,-12 0,-12 Z" fill="#D72D58" stroke="#800A40" stroke-width="1" />
      <polygon points="0,-15 -4,-11 0,-8 4,-11" fill="#2E7D4F" />

      <!-- Left Berries -->
      <circle cx="-35" cy="-2" r="11" fill="#A31D56" stroke="#6E0C36" stroke-width="1" />
      <circle cx="-38" cy="-5" r="3" fill="#FED7E7" opacity="0.8" />
      <circle cx="-55" cy="5" r="10" fill="#6E0C36" stroke="#45001E" stroke-width="1" />

      <!-- Right Berries -->
      <circle cx="35" cy="-2" r="11" fill="#A31D56" stroke="#6E0C36" stroke-width="1" />
      <circle cx="32" cy="-5" r="3" fill="#FED7E7" opacity="0.8" />
      <circle cx="55" cy="5" r="10" fill="#6E0C36" stroke="#45001E" stroke-width="1" />

      <!-- Blueberries -->
      <circle cx="-18" cy="8" r="8" fill="#4A148C" stroke="#311B92" stroke-width="1" />
      <circle cx="20" cy="8" r="8" fill="#4A148C" stroke="#311B92" stroke-width="1" />

      <!-- Mint Leaves -->
      <path d="M-8,-16 C-18,-24 -15,-32 -5,-30 C-2,-25 -3,-18 -8,-16 Z" fill="#2E7D4F" />
      <path d="M8,-16 C18,-24 15,-32 5,-30 C2,-25 3,-18 8,-16 Z" fill="#4CAF50" />
    </g>

    <!-- Sparkles -->
    <path d="M-140,-95 Q-140,-105 -150,-105 Q-140,-105 -140,-115 Q-140,-105 -130,-105 Q-140,-105 -140,-95 Z" fill="#E8A33D" />
    <path d="M140,-85 Q140,-93 132,-93 Q140,-93 140,-101 Q140,-93 148,-93 Q140,-93 140,-85 Z" fill="#E8A33D" />
  </g>

  <!-- Bottom Brand Pill -->
  <g transform="translate(300, 520)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#FFFFFF" stroke="#FED7E7" stroke-width="2" filter="url(#bc-shadow)" />
    <circle cx="-105" cy="0" r="14" fill="#A31D56" />
    <path d="M-109,-4 L-101,0 L-109,4 Z" fill="#FFFFFF" />
    <text x="-80" y="6" font-family="'El Messiri', 'IBM Plex Sans Arabic', sans-serif" font-weight="700" font-size="16" fill="#A31D56">كاندي لوز</text>
    <text x="5" y="5" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="600" font-size="12" fill="#E8A33D">تشيز كيك التوت (بيري)</text>
  </g>
</svg>