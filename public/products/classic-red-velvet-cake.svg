<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <title>كيك ريد فيلفيت كلاسيك بالجبنة الكريمة - كاندي لوز</title>
  <defs>
    <linearGradient id="rv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="50%" stop-color="#F9DCD9" />
      <stop offset="100%" stop-color="#FBD3DD" />
    </linearGradient>
    <linearGradient id="sponge-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C2185B" />
      <stop offset="50%" stop-color="#9C0F38" />
      <stop offset="100%" stop-color="#670522" />
    </linearGradient>
    <linearGradient id="frosting-white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF0F5" />
    </linearGradient>
    <filter id="rv-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#9C0F38" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#rv-bg)" />

  <!-- Pedestal Plate -->
  <g filter="url(#rv-shadow)" transform="translate(300, 310)">
    <!-- Base Plate -->
    <ellipse cx="0" cy="50" rx="190" ry="34" fill="#FFFFFF" stroke="#FBD3DD" stroke-width="3" />
    <ellipse cx="0" cy="46" rx="175" ry="30" fill="#FFFDFD" stroke="#A31D56" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4" />

    <!-- Cake Slice / Cake Layers -->
    <!-- Layer 1 Sponge (Bottom) -->
    <path d="M-130,22 C-130,48 130,48 130,22 L130,0 C130,26 -130,26 -130,0 Z" fill="url(#sponge-red)" />
    <!-- Cream Layer 1 -->
    <path d="M-130,0 C-130,26 130,26 130,0 L130,-12 C130,14 -130,14 -130,-12 Z" fill="url(#frosting-white)" />
    <!-- Layer 2 Sponge (Middle) -->
    <path d="M-130,-12 C-130,14 130,14 130,-12 L130,-36 C130,-10 -130,-10 -130,-36 Z" fill="url(#sponge-red)" />
    <!-- Cream Layer 2 -->
    <path d="M-130,-36 C-130,-10 130,-10 130,-36 L130,-48 C130,-22 -130,-22 -130,-48 Z" fill="url(#frosting-white)" />
    <!-- Layer 3 Sponge (Top) -->
    <path d="M-130,-48 C-130,-22 130,-22 130,-48 L130,-72 C130,-46 -130,-46 -130,-72 Z" fill="url(#sponge-red)" />

    <!-- Top Frosting Blanket -->
    <ellipse cx="0" cy="-72" rx="130" ry="28" fill="url(#frosting-white)" stroke="#FED7E7" stroke-width="2" />

    <!-- Piped Rosettes around top edge -->
    <g transform="translate(0, -78)">
      <circle cx="-100" cy="8" r="14" fill="#FFFFFF" stroke="#FED7E7" stroke-width="1.5" />
      <circle cx="-100" cy="8" r="6" fill="#FBD3DD" />

      <circle cx="-60" cy="18" r="14" fill="#FFFFFF" stroke="#FED7E7" stroke-width="1.5" />
      <circle cx="-60" cy="18" r="6" fill="#FBD3DD" />

      <circle cx="0" cy="22" r="15" fill="#FFFFFF" stroke="#FED7E7" stroke-width="1.5" />
      <circle cx="0" cy="22" r="7" fill="#FBD3DD" />

      <circle cx="60" cy="18" r="14" fill="#FFFFFF" stroke="#FED7E7" stroke-width="1.5" />
      <circle cx="60" cy="18" r="6" fill="#FBD3DD" />

      <circle cx="100" cy="8" r="14" fill="#FFFFFF" stroke="#FED7E7" stroke-width="1.5" />
      <circle cx="100" cy="8" r="6" fill="#FBD3DD" />

      <!-- Center dusted cake crumbs -->
      <g fill="#9C0F38">
        <circle cx="-30" cy="-6" r="3" />
        <circle cx="-15" cy="-2" r="2.5" />
        <circle cx="10" cy="-4" r="3" />
        <circle cx="28" cy="-8" r="2.5" />
        <circle cx="-5" cy="8" r="3" />
        <circle cx="20" cy="6" r="2.5" />
        <circle cx="-45" cy="4" r="2" />
        <circle cx="45" cy="2" r="2.5" />
      </g>
    </g>

    <!-- Sparkles -->
    <path d="M-140,-105 Q-140,-115 -150,-115 Q-140,-115 -140,-125 Q-140,-115 -130,-115 Q-140,-115 -140,-105 Z" fill="#E8A33D" />
    <path d="M140,-95 Q140,-103 132,-103 Q140,-103 140,-111 Q140,-103 148,-103 Q140,-103 140,-95 Z" fill="#E8A33D" />
  </g>

  <!-- Bottom Brand Pill -->
  <g transform="translate(300, 520)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#FFFFFF" stroke="#FED7E7" stroke-width="2" filter="url(#rv-shadow)" />
    <circle cx="-105" cy="0" r="14" fill="#A31D56" />
    <path d="M-109,-4 L-101,0 L-109,4 Z" fill="#FFFFFF" />
    <text x="-80" y="6" font-family="'El Messiri', 'IBM Plex Sans Arabic', sans-serif" font-weight="700" font-size="16" fill="#A31D56">كاندي لوز</text>
    <text x="5" y="5" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="600" font-size="12" fill="#E8A33D">كيك ريد فيلفيت</text>
  </g>
</svg>