<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <title>كنافة نابلسية خشنة بالجبنة البلدية - كاندي لوز</title>
  <defs>
    <linearGradient id="kn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8" />
      <stop offset="50%" stop-color="#FBECC8" />
      <stop offset="100%" stop-color="#F6E0D2" />
    </linearGradient>
    <linearGradient id="copper-pan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E59866" />
      <stop offset="40%" stop-color="#BA4A00" />
      <stop offset="80%" stop-color="#873600" />
      <stop offset="100%" stop-color="#5E2600" />
    </linearGradient>
    <linearGradient id="kunafa-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D" />
      <stop offset="40%" stop-color="#FB8C00" />
      <stop offset="80%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#BF360C" />
    </linearGradient>
    <linearGradient id="cheese-stretch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF9C4" />
    </linearGradient>
    <linearGradient id="pistachio-crush" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CCC65" />
      <stop offset="60%" stop-color="#558B2F" />
      <stop offset="100%" stop-color="#2E7D32" />
    </linearGradient>
    <filter id="kn-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#873600" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#kn-bg)" />

  <!-- Traditional Kunafa Pan -->
  <g filter="url(#kn-shadow)" transform="translate(300, 280)">
    <!-- Copper Seder / Tray Rim -->
    <circle cx="0" cy="0" r="215" fill="url(#copper-pan)" />
    <circle cx="0" cy="0" r="202" fill="#FAF5EF" />
    <circle cx="0" cy="0" r="195" fill="url(#kunafa-orange)" />

    <!-- Rough vermicelli texture strokes -->
    <g stroke="#FFE082" stroke-width="2.5" fill="none" opacity="0.6">
      <path d="M-140,-60 Q-80,-100 -20,-70 Q40,-40 100,-75 Q150,-50 170,-10" />
      <path d="M-160,-10 Q-100,20 -40,-20 Q20,-60 80,-15 Q140,25 170,10" />
      <path d="M-150,50 Q-90,10 -30,60 Q30,100 90,45 Q150,0 160,60" />
      <path d="M-120,95 Q-60,70 0,110 Q60,130 120,85" />
      <path d="M-130,-110 Q-70,-130 0,-100 Q70,-80 130,-115" />
    </g>

    <!-- Hot Cheese Stretch / Lifted Slice Wedge -->
    <g transform="translate(45, -30) rotate(-25)">
      <!-- Melted cheese pulled out -->
      <path d="M-30,-20 Q10,-70 50,-120 Q60,-70 30,-10 Z" fill="url(#cheese-stretch)" stroke="#FFE082" stroke-width="1.5" />
      <path d="M-15,-10 Q25,-60 65,-110 Q65,-60 45,0 Z" fill="url(#cheese-stretch)" opacity="0.8" />
      <path d="M0,0 Q35,-50 80,-95 Q75,-45 55,10 Z" fill="url(#cheese-stretch)" opacity="0.9" />

      <!-- Lifted triangular wedge of kunafa on spatula/fork -->
      <polygon points="40,-130 95,-105 75,-75" fill="url(#kunafa-orange)" stroke="#E65100" stroke-width="1.5" />
      <polygon points="40,-130 75,-75 55,-70" fill="url(#cheese-stretch)" />
      <!-- Pistachio on wedge -->
      <ellipse cx="70" cy="-100" rx="8" ry="5" fill="url(#pistachio-crush)" />
    </g>

    <!-- Generous Pistachio Border and Center Ring -->
    <!-- Center Pistachio Crown -->
    <ellipse cx="-20" cy="10" rx="46" ry="32" fill="url(#pistachio-crush)" stroke="#2E7D32" stroke-width="1.5" />
    <circle cx="-25" cy="6" r="6" fill="#DCEDC8" />
    <circle cx="-10" cy="12" r="5" fill="#DCEDC8" />
    <circle cx="-30" cy="18" r="4.5" fill="#33691E" />

    <!-- Outer crescent sprinkles of crushed pistachios -->
    <g fill="url(#pistachio-crush)">
      <circle cx="-120" cy="-70" r="7" />
      <circle cx="-140" cy="-40" r="6" />
      <circle cx="-150" cy="0" r="7.5" />
      <circle cx="-140" cy="50" r="6.5" />
      <circle cx="-110" cy="95" r="7" />
      <circle cx="-60" cy="130" r="8" />
      <circle cx="0" cy="145" r="7.5" />
      <circle cx="65" cy="135" r="6.5" />
      <circle cx="115" cy="100" r="7" />
    </g>

    <!-- Honey Syrup Gloss Sparkles -->
    <path d="M-80,-90 Q-80,-100 -90,-100 Q-80,-100 -80,-110 Q-80,-100 -70,-100 Q-80,-100 -80,-90 Z" fill="#FFE082" />
    <path d="M-10,70 Q-10,62 -18,62 Q-10,62 -10,54 Q-10,62 -2,62 Q-10,62 -10,70 Z" fill="#FFE082" />
  </g>

  <!-- Bottom Brand Pill -->
  <g transform="translate(300, 520)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#FFFFFF" stroke="#FED7E7" stroke-width="2" filter="url(#kn-shadow)" />
    <circle cx="-105" cy="0" r="14" fill="#A31D56" />
    <path d="M-109,-4 L-101,0 L-109,4 Z" fill="#FFFFFF" />
    <text x="-80" y="6" font-family="'El Messiri', 'IBM Plex Sans Arabic', sans-serif" font-weight="700" font-size="16" fill="#A31D56">كاندي لوز</text>
    <text x="5" y="5" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="600" font-size="12" fill="#E8A33D">كنافة نابلسية خشنة</text>
  </g>
</svg>