<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <title>صينية مشكل بقلاوة إكسترا فستق - كاندي لوز</title>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="60%" stop-color="#FBECC8" />
      <stop offset="100%" stop-color="#F6E0D2" />
    </linearGradient>
    <radialGradient id="tray-glow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E8A33D" stop-opacity="0.15" />
    </radialGradient>
    <linearGradient id="gold-tray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0C8" />
      <stop offset="40%" stop-color="#E8A33D" />
      <stop offset="80%" stop-color="#C78018" />
      <stop offset="100%" stop-color="#8E5208" />
    </linearGradient>
    <linearGradient id="baklava-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4A0" />
      <stop offset="50%" stop-color="#E5A638" />
      <stop offset="100%" stop-color="#B77312" />
    </linearGradient>
    <linearGradient id="baklava-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D99326" />
      <stop offset="100%" stop-color="#874706" />
    </linearGradient>
    <linearGradient id="pistachio-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A2D149" />
      <stop offset="50%" stop-color="#6DA828" />
      <stop offset="100%" stop-color="#467314" />
    </linearGradient>
    <linearGradient id="brand-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C22367" />
      <stop offset="100%" stop-color="#800A40" />
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#800A40" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" fill="url(#bg-grad)" />

  <!-- Decorative Arabesque Circles in Corners -->
  <g opacity="0.18" stroke="#A31D56" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="140" stroke-dasharray="8 6" />
    <circle cx="0" cy="0" r="180" />
    <circle cx="600" cy="600" r="140" stroke-dasharray="8 6" />
    <circle cx="600" cy="600" r="180" />
  </g>

  <!-- Central Tray Shadow & Body -->
  <g filter="url(#card-shadow)">
    <!-- Ornate Brass Tray Border -->
    <circle cx="300" cy="290" r="215" fill="url(#gold-tray)" />
    <circle cx="300" cy="290" r="202" fill="#FAF6EE" />
    <circle cx="300" cy="290" r="198" fill="url(#tray-glow)" stroke="#E8A33D" stroke-width="2" stroke-dasharray="4 3" />
  </g>

  <!-- Baklava Diamonds Grid on Tray -->
  <g transform="translate(300, 290)">
    <!-- Central Cluster of Diamond Baklava Pieces -->
    <!-- Center Piece -->
    <g transform="translate(0, -10)">
      <!-- Base Layer 3D -->
      <polygon points="0,-45 42,-12 0,22 -42,-12" fill="url(#baklava-dark)" />
      <polygon points="0,-48 42,-15 0,18 -42,-15" fill="url(#baklava-gold)" />
      <!-- Layer Lines -->
      <path d="M-42,-15 L0,18 L42,-15" stroke="#FFE4A0" stroke-width="1.5" fill="none" opacity="0.6" />
      <!-- Pistachio Crumble on top -->
      <ellipse cx="0" cy="-14" rx="20" ry="10" fill="url(#pistachio-grad)" />
      <circle cx="-6" cy="-15" r="3" fill="#BCE46E" />
      <circle cx="4" cy="-12" r="2.5" fill="#467314" />
      <circle cx="8" cy="-16" r="2" fill="#BCE46E" />
    </g>

    <!-- Top Left Diamond -->
    <g transform="translate(-55, -55)">
      <polygon points="0,-40 38,-10 0,20 -38,-10" fill="url(#baklava-dark)" />
      <polygon points="0,-43 38,-13 0,17 -38,-13" fill="url(#baklava-gold)" />
      <ellipse cx="0" cy="-13" rx="17" ry="8" fill="url(#pistachio-grad)" />
      <circle cx="-4" cy="-14" r="2.5" fill="#BCE46E" />
      <circle cx="5" cy="-12" r="2" fill="#467314" />
    </g>

    <!-- Top Right Diamond -->
    <g transform="translate(55, -55)">
      <polygon points="0,-40 38,-10 0,20 -38,-10" fill="url(#baklava-dark)" />
      <polygon points="0,-43 38,-13 0,17 -38,-13" fill="url(#baklava-gold)" />
      <ellipse cx="0" cy="-13" rx="17" ry="8" fill="url(#pistachio-grad)" />
      <circle cx="3" cy="-14" r="2.5" fill="#BCE46E" />
      <circle cx="-5" cy="-12" r="2" fill="#467314" />
    </g>

    <!-- Bottom Left Diamond -->
    <g transform="translate(-55, 35)">
      <polygon points="0,-40 38,-10 0,20 -38,-10" fill="url(#baklava-dark)" />
      <polygon points="0,-43 38,-13 0,17 -38,-13" fill="url(#baklava-gold)" />
      <ellipse cx="0" cy="-13" rx="17" ry="8" fill="url(#pistachio-grad)" />
      <circle cx="2" cy="-14" r="2.5" fill="#BCE46E" />
      <circle cx="-3" cy="-12" r="2" fill="#467314" />
    </g>

    <!-- Bottom Right Diamond -->
    <g transform="translate(55, 35)">
      <polygon points="0,-40 38,-10 0,20 -38,-10" fill="url(#baklava-dark)" />
      <polygon points="0,-43 38,-13 0,17 -38,-13" fill="url(#baklava-gold)" />
      <ellipse cx="0" cy="-13" rx="17" ry="8" fill="url(#pistachio-grad)" />
      <circle cx="-2" cy="-14" r="2.5" fill="#BCE46E" />
      <circle cx="4" cy="-12" r="2" fill="#467314" />
    </g>

    <!-- Outer Ring Rolled Baklava Fingers / Kolaj -->
    <g transform="translate(0, 95)">
      <polygon points="0,-36 34,-8 0,18 -34,-8" fill="url(#baklava-dark)" />
      <polygon points="0,-39 34,-11 0,15 -34,-11" fill="url(#baklava-gold)" />
      <ellipse cx="0" cy="-11" rx="15" ry="7" fill="url(#pistachio-grad)" />
    </g>
    <g transform="translate(0, -115)">
      <polygon points="0,-36 34,-8 0,18 -34,-8" fill="url(#baklava-dark)" />
      <polygon points="0,-39 34,-11 0,15 -34,-11" fill="url(#baklava-gold)" />
      <ellipse cx="0" cy="-11" rx="15" ry="7" fill="url(#pistachio-grad)" />
    </g>
    <g transform="translate(-110, -10)">
      <polygon points="0,-36 34,-8 0,18 -34,-8" fill="url(#baklava-dark)" />
      <polygon points="0,-39 34,-11 0,15 -34,-11" fill="url(#baklava-gold)" />
      <ellipse cx="0" cy="-11" rx="15" ry="7" fill="url(#pistachio-grad)" />
    </g>
    <g transform="translate(110, -10)">
      <polygon points="0,-36 34,-8 0,18 -34,-8" fill="url(#baklava-dark)" />
      <polygon points="0,-39 34,-11 0,15 -34,-11" fill="url(#baklava-gold)" />
      <ellipse cx="0" cy="-11" rx="15" ry="7" fill="url(#pistachio-grad)" />
    </g>

    <!-- Honey Syrup Glistening Droplets -->
    <path d="M-20,-75 C-18,-85 -10,-85 -10,-75 C-10,-68 -15,-65 -20,-75 Z" fill="#FFC837" opacity="0.8" />
    <path d="M80,-20 C82,-28 88,-28 88,-20 C88,-14 84,-12 80,-20 Z" fill="#FFC837" opacity="0.8" />
    <path d="M-85,55 C-83,47 -77,47 -77,55 C-77,61 -81,63 -85,55 Z" fill="#FFC837" opacity="0.8" />

    <!-- Sparkles -->
    <path d="M-130,-120 Q-130,-130 -140,-130 Q-130,-130 -130,-140 Q-130,-130 -120,-130 Q-130,-130 -130,-120 Z" fill="#E8A33D" />
    <path d="M140,-110 Q140,-118 132,-118 Q140,-118 140,-126 Q140,-118 148,-118 Q140,-118 140,-110 Z" fill="#E8A33D" />
  </g>

  <!-- Branded Seal / Bottom Ribbon -->
  <g transform="translate(300, 520)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#FFFFFF" stroke="#FED7E7" stroke-width="2" filter="url(#card-shadow)" />
    <circle cx="-105" cy="0" r="14" fill="url(#brand-badge)" />
    <path d="M-109,-4 L-101,0 L-109,4 Z" fill="#FFFFFF" />
    <text x="-80" y="6" font-family="'El Messiri', 'IBM Plex Sans Arabic', sans-serif" font-weight="700" font-size="16" fill="#A31D56">كاندي لوز</text>
    <text x="5" y="5" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="600" font-size="12" fill="#E8A33D">بقلاوة إكسترا فستق</text>
  </g>
</svg>