<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <title>غريبة شامية بالفستق الحلبي - كاندي لوز</title>
  <defs>
    <linearGradient id="gh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="60%" stop-color="#FBECC8" />
      <stop offset="100%" stop-color="#F6E0D2" />
    </linearGradient>
    <linearGradient id="ghraybeh-ivory" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFF8F0" />
      <stop offset="100%" stop-color="#F5E8D8" />
    </linearGradient>
    <linearGradient id="pistachio-nut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CCC65" />
      <stop offset="50%" stop-color="#43A047" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    <filter id="gh-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#795548" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#gh-bg)" />

  <!-- Elegant Filigree China Plate -->
  <g filter="url(#gh-shadow)" transform="translate(300, 275)">
    <circle cx="0" cy="0" r="210" fill="#FFFFFF" stroke="#FBECC8" stroke-width="4" />
    <circle cx="0" cy="0" r="198" fill="#FFFDF9" stroke="#E8A33D" stroke-width="1.5" stroke-dasharray="5 3.5" />

    <!-- 4 Classic Ghraybeh Pieces Arranged in Cross Presentation -->

    <!-- Center Top: Traditional S-Shape / Bracelet Ghraybeh -->
    <g transform="translate(0, -65)">
      <!-- Smooth ivory dough loop -->
      <path d="M-35,0 C-35,-28 0,-28 15,-12 C30,4 35,24 15,28 C-5,32 -25,12 -10,0 C5,-12 35,-6 35,-24" fill="none" stroke="url(#ghraybeh-ivory)" stroke-width="26" stroke-linecap="round" />
      <!-- Whole emerald pistachio crown -->
      <ellipse cx="0" cy="0" rx="12" ry="7" fill="url(#pistachio-nut)" stroke="#1B5E20" stroke-width="1" transform="rotate(-15, 0, 0)" />
      <circle cx="-2" cy="-2" r="2" fill="#DCEDC8" />
    </g>

    <!-- Left: Ring / Wreath Ghraybeh -->
    <g transform="translate(-75, 20)">
      <circle cx="0" cy="0" r="38" fill="url(#ghraybeh-ivory)" stroke="#F5E8D8" stroke-width="1.5" />
      <circle cx="0" cy="0" r="14" fill="#FFFDF9" stroke="#F5E8D8" stroke-width="1.5" />
      <!-- Pistachio resting on top curve -->
      <ellipse cx="0" cy="-22" rx="12" ry="7" fill="url(#pistachio-nut)" stroke="#1B5E20" stroke-width="1" />
      <circle cx="-2" cy="-24" r="2" fill="#DCEDC8" />
    </g>

    <!-- Right: Ring / Wreath Ghraybeh -->
    <g transform="translate(75, 20)">
      <circle cx="0" cy="0" r="38" fill="url(#ghraybeh-ivory)" stroke="#F5E8D8" stroke-width="1.5" />
      <circle cx="0" cy="0" r="14" fill="#FFFDF9" stroke="#F5E8D8" stroke-width="1.5" />
      <ellipse cx="0" cy="-22" rx="12" ry="7" fill="url(#pistachio-nut)" stroke="#1B5E20" stroke-width="1" />
      <circle cx="-2" cy="-24" r="2" fill="#DCEDC8" />
    </g>

    <!-- Bottom Center: Teardrop Ghraybeh -->
    <g transform="translate(0, 85)">
      <ellipse cx="0" cy="0" rx="36" ry="24" fill="url(#ghraybeh-ivory)" stroke="#F5E8D8" stroke-width="1.5" />
      <!-- Central Pistachio -->
      <ellipse cx="0" cy="0" rx="14" ry="8" fill="url(#pistachio-nut)" stroke="#1B5E20" stroke-width="1" />
      <circle cx="-3" cy="-2" r="2.5" fill="#DCEDC8" />
    </g>

    <!-- Scattered pistachio crumbles & rose water drops -->
    <circle cx="-30" cy="-25" r="3.5" fill="#43A047" />
    <circle cx="35" cy="-20" r="3" fill="#43A047" />
    <circle cx="-25" cy="45" r="3" fill="#43A047" />
    <circle cx="30" cy="50" r="3.5" fill="#43A047" />

    <!-- Sparkles -->
    <path d="M-130,-90 Q-130,-100 -140,-100 Q-130,-100 -130,-110 Q-130,-100 -120,-100 Q-130,-100 -130,-90 Z" fill="#E8A33D" />
    <path d="M130,-80 Q130,-88 122,-88 Q130,-88 130,-96 Q130,-88 138,-88 Q130,-88 130,-80 Z" fill="#E8A33D" />
  </g>

  <!-- Bottom Brand Pill -->
  <g transform="translate(300, 520)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#FFFFFF" stroke="#FED7E7" stroke-width="2" filter="url(#gh-shadow)" />
    <circle cx="-105" cy="0" r="14" fill="#A31D56" />
    <path d="M-109,-4 L-101,0 L-109,4 Z" fill="#FFFFFF" />
    <text x="-80" y="6" font-family="'El Messiri', 'IBM Plex Sans Arabic', sans-serif" font-weight="700" font-size="16" fill="#A31D56">كاندي لوز</text>
    <text x="5" y="5" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="600" font-size="12" fill="#E8A33D">غريبة شامية بالفستق</text>
  </g>
</svg>