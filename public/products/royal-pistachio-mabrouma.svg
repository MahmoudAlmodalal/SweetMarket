<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <title>مبرومة بالفستق الحلبي الملكي - كاندي لوز</title>
  <defs>
    <linearGradient id="mb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF8" />
      <stop offset="60%" stop-color="#FBECC8" />
      <stop offset="100%" stop-color="#F6E0D2" />
    </linearGradient>
    <linearGradient id="kunafa-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="40%" stop-color="#F5B041" />
      <stop offset="80%" stop-color="#D68910" />
      <stop offset="100%" stop-color="#935116" />
    </linearGradient>
    <linearGradient id="pistachio-gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#82E0AA" />
      <stop offset="40%" stop-color="#28B463" />
      <stop offset="100%" stop-color="#145A32" />
    </linearGradient>
    <filter id="mb-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7D4100" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#mb-bg)" />

  <!-- Radial decorative dish -->
  <g filter="url(#mb-shadow)" transform="translate(300, 275)">
    <!-- Ornate porcelain plate with gold rim -->
    <circle cx="0" cy="0" r="210" fill="#FFFFFF" stroke="#E8A33D" stroke-width="4" />
    <circle cx="0" cy="0" r="198" fill="#FFFDFB" stroke="#FED7E7" stroke-width="2" stroke-dasharray="6 4" />

    <!-- 3 Mabrouma Rolls arranged in a circular presentation -->
    <!-- Roll 1 (Top Left) -->
    <g transform="translate(-65, -50) rotate(-15)">
      <!-- Outer spiral kunafa cylinder -->
      <ellipse cx="0" cy="0" rx="90" ry="42" fill="url(#kunafa-gold)" stroke="#935116" stroke-width="2" />
      <!-- Spiral kunafa noodle threads -->
      <path d="M-80,-10 Q-30,-35 40,-25 Q70,-15 85,5" fill="none" stroke="#FFEAA7" stroke-width="2.5" opacity="0.8" />
      <path d="M-75,10 Q-20,-10 50,0 Q80,10 85,20" fill="none" stroke="#FFEAA7" stroke-width="2.5" opacity="0.8" />
      <path d="M-60,25 Q0,10 60,22" fill="none" stroke="#FFEAA7" stroke-width="2.5" opacity="0.8" />
      <!-- Cross section cut showing dense pistachios -->
      <ellipse cx="-55" cy="0" rx="28" ry="36" fill="#145A32" />
      <ellipse cx="-55" cy="0" rx="24" ry="32" fill="url(#pistachio-gem)" />
      <!-- Pistachio clusters inside cut -->
      <circle cx="-62" cy="-12" r="7" fill="#82E0AA" />
      <circle cx="-48" cy="-8" r="6.5" fill="#28B463" />
      <circle cx="-58" cy="10" r="8" fill="#82E0AA" />
      <circle cx="-46" cy="14" r="6" fill="#1E8449" />
    </g>

    <!-- Roll 2 (Bottom Right) -->
    <g transform="translate(45, 40) rotate(20)">
      <ellipse cx="0" cy="0" rx="95" ry="44" fill="url(#kunafa-gold)" stroke="#935116" stroke-width="2" />
      <path d="M-85,-10 Q-30,-35 40,-25 Q70,-15 90,5" fill="none" stroke="#FFEAA7" stroke-width="2.5" opacity="0.8" />
      <path d="M-80,10 Q-20,-10 50,0 Q80,10 90,20" fill="none" stroke="#FFEAA7" stroke-width="2.5" opacity="0.8" />
      <!-- Cross section cut -->
      <ellipse cx="60" cy="0" rx="28" ry="38" fill="#145A32" />
      <ellipse cx="60" cy="0" rx="24" ry="34" fill="url(#pistachio-gem)" />
      <circle cx="54" cy="-12" r="7" fill="#82E0AA" />
      <circle cx="68" cy="-8" r="6.5" fill="#28B463" />
      <circle cx="56" cy="10" r="8" fill="#82E0AA" />
      <circle cx="68" cy="14" r="6" fill="#1E8449" />
    </g>

    <!-- Pistachios scattered in center & plate -->
    <g transform="translate(0, -10)">
      <circle cx="-15" cy="35" r="7" fill="url(#pistachio-gem)" stroke="#145A32" stroke-width="1" />
      <circle cx="10" cy="20" r="8" fill="url(#pistachio-gem)" stroke="#145A32" stroke-width="1" />
      <circle cx="30" cy="-45" r="7.5" fill="url(#pistachio-gem)" stroke="#145A32" stroke-width="1" />
      <circle cx="-95" cy="85" r="6.5" fill="url(#pistachio-gem)" stroke="#145A32" stroke-width="1" />
      <circle cx="105" cy="-80" r="7" fill="url(#pistachio-gem)" stroke="#145A32" stroke-width="1" />
    </g>

    <!-- Golden honey glaze sparkles -->
    <path d="M-20,-80 Q-20,-90 -30,-90 Q-20,-90 -20,-100 Q-20,-90 -10,-90 Q-20,-90 -20,-80 Z" fill="#E8A33D" />
    <path d="M120,60 Q120,52 112,52 Q120,52 120,44 Q120,52 128,52 Q120,52 120,60 Z" fill="#E8A33D" />
  </g>

  <!-- Bottom Brand Pill -->
  <g transform="translate(300, 520)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#FFFFFF" stroke="#FED7E7" stroke-width="2" filter="url(#mb-shadow)" />
    <circle cx="-105" cy="0" r="14" fill="#A31D56" />
    <path d="M-109,-4 L-101,0 L-109,4 Z" fill="#FFFFFF" />
    <text x="-80" y="6" font-family="'El Messiri', 'IBM Plex Sans Arabic', sans-serif" font-weight="700" font-size="16" fill="#A31D56">كاندي لوز</text>
    <text x="5" y="5" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="600" font-size="12" fill="#E8A33D">مبرومة فستق ملكي</text>
  </g>
</svg>