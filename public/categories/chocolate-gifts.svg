<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <title>شوكولاتة وبوكسات هدايا - كاندي لوز</title>
  <defs>
    <linearGradient id="cat-ch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="50%" stop-color="#FBD3DD" />
      <stop offset="100%" stop-color="#FED7E7" />
    </linearGradient>
    <linearGradient id="cat-ch-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C22367" />
      <stop offset="50%" stop-color="#A31D56" />
      <stop offset="100%" stop-color="#670522" />
    </linearGradient>
    <linearGradient id="cat-ch-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="40%" stop-color="#F5B041" />
      <stop offset="100%" stop-color="#B7770D" />
    </linearGradient>
    <filter id="cat-ch-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#670522" flood-opacity="0.22" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#cat-ch-bg)" />

  <g filter="url(#cat-ch-shadow)" transform="translate(300, 280)">
    <!-- Velvet Hex Gift Box with Bow -->
    <rect x="-150" y="-120" width="300" height="240" rx="32" fill="url(#cat-ch-box)" stroke="#FED7E7" stroke-width="3" />

    <!-- Satin Golden Ribbon Cross -->
    <rect x="-20" y="-120" width="40" height="240" fill="url(#cat-ch-gold)" />
    <rect x="-150" y="-20" width="300" height="40" fill="url(#cat-ch-gold)" />

    <!-- Center Luxurious Ribbon Bow -->
    <g transform="translate(0, 0)">
      <!-- Left Loop -->
      <path d="M0,0 C-35,-30 -60,-25 -65,-10 C-70,10 -40,15 0,0 Z" fill="url(#cat-ch-gold)" stroke="#B7770D" stroke-width="1.5" />
      <!-- Right Loop -->
      <path d="M0,0 C35,-30 60,-25 65,-10 C70,10 40,15 0,0 Z" fill="url(#cat-ch-gold)" stroke="#B7770D" stroke-width="1.5" />
      <!-- Center Knot -->
      <circle cx="0" cy="0" r="16" fill="url(#cat-ch-box)" stroke="#FFD54F" stroke-width="2" />
      <circle cx="0" cy="0" r="8" fill="#FFD54F" />
    </g>

    <!-- Artisan Truffles Placed Around -->
    <circle cx="-90" cy="-65" r="22" fill="#2B1A10" stroke="#FFD54F" stroke-width="1" />
    <circle cx="90" cy="-65" r="22" fill="#3E2723" stroke="#FFD54F" stroke-width="1" />
    <circle cx="-90" cy="65" r="22" fill="#FFFDF8" stroke="#FED7E7" stroke-width="1" />
    <circle cx="90" cy="65" r="22" fill="#D68910" stroke="#FFE082" stroke-width="1" />

    <!-- Sparkles -->
    <path d="M-120,-110 Q-120,-120 -130,-120 Q-120,-120 -120,-130 Q-120,-120 -110,-120 Q-120,-120 -120,-110 Z" fill="#FFD54F" />
    <path d="M120,-100 Q120,-108 112,-108 Q120,-108 120,-116 Q120,-108 128,-108 Q120,-108 120,-100 Z" fill="#FFD54F" />
  </g>

  <!-- Bottom Brand Pill -->
  <g transform="translate(300, 520)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#FFFFFF" stroke="#FED7E7" stroke-width="2" filter="url(#cat-ch-shadow)" />
    <circle cx="-105" cy="0" r="14" fill="#A31D56" />
    <path d="M-109,-4 L-101,0 L-109,4 Z" fill="#FFFFFF" />
    <text x="-80" y="6" font-family="'El Messiri', 'IBM Plex Sans Arabic', sans-serif" font-weight="700" font-size="16" fill="#A31D56">كاندي لوز</text>
    <text x="5" y="5" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="600" font-size="12" fill="#E8A33D">شوكولاتة وبوكسات هدايا</text>
  </g>
</svg>