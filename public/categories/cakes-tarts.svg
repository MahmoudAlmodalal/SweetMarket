<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <title>كيك وتورتات المناسبات - كاندي لوز</title>
  <defs>
    <linearGradient id="cat-cake-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F8" />
      <stop offset="50%" stop-color="#FBD3DD" />
      <stop offset="100%" stop-color="#FED7E7" />
    </linearGradient>
    <linearGradient id="cat-cake-tier" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C22367" />
      <stop offset="60%" stop-color="#A31D56" />
      <stop offset="100%" stop-color="#670522" />
    </linearGradient>
    <filter id="cat-cake-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#A31D56" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#cat-cake-bg)" />

  <g filter="url(#cat-cake-shadow)" transform="translate(300, 290)">
    <!-- Stand Base -->
    <ellipse cx="0" cy="70" rx="170" ry="28" fill="#FFFFFF" stroke="#FED7E7" stroke-width="3" />

    <!-- Cake Bottom Tier -->
    <path d="M-120,40 C-120,68 120,68 120,40 L120,-10 C120,18 -120,18 -120,-10 Z" fill="url(#cat-cake-tier)" />
    <ellipse cx="0" cy="-10" rx="120" ry="24" fill="#FFE082" />

    <!-- Cake Top Tier -->
    <path d="M-80,-10 C-80,10 80,10 80,-10 L80,-60 C80,-40 -80,-40 -80,-60 Z" fill="url(#cat-cake-tier)" />
    <ellipse cx="0" cy="-60" rx="80" ry="18" fill="#FFFFFF" stroke="#FED7E7" stroke-width="2" />

    <!-- Celebration Candle & Flame -->
    <rect x="-4" y="-95" width="8" height="35" rx="2" fill="#FFE082" />
    <path d="M0,-115 C5,-105 5,-98 0,-95 C-5,-98 -5,-105 0,-115 Z" fill="#FF5722" />
    <circle cx="0" cy="-102" r="3" fill="#FFEB3B" />

    <!-- Strawberries & Cream Drops -->
    <circle cx="-50" cy="-10" r="10" fill="#D72D58" />
    <circle cx="50" cy="-10" r="10" fill="#D72D58" />
    <circle cx="-35" cy="-60" r="8" fill="#D72D58" />
    <circle cx="35" cy="-60" r="8" fill="#D72D58" />

    <!-- Sparkles -->
    <path d="M-130,-90 Q-130,-100 -140,-100 Q-130,-100 -130,-110 Q-130,-100 -120,-100 Q-130,-100 -130,-90 Z" fill="#E8A33D" />
    <path d="M130,-80 Q130,-88 122,-88 Q130,-88 130,-96 Q130,-88 138,-88 Q130,-88 130,-80 Z" fill="#E8A33D" />
  </g>

  <!-- Bottom Brand Pill -->
  <g transform="translate(300, 520)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#FFFFFF" stroke="#FED7E7" stroke-width="2" filter="url(#cat-cake-shadow)" />
    <circle cx="-105" cy="0" r="14" fill="#A31D56" />
    <path d="M-109,-4 L-101,0 L-109,4 Z" fill="#FFFFFF" />
    <text x="-80" y="6" font-family="'El Messiri', 'IBM Plex Sans Arabic', sans-serif" font-weight="700" font-size="16" fill="#A31D56">كاندي لوز</text>
    <text x="5" y="5" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="600" font-size="12" fill="#E8A33D">كيك وتورتات المناسبات</text>
  </g>
</svg>