<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <title>بيتيفور وسابليه فاخر - كاندي لوز</title>
  <defs>
    <linearGradient id="cat-pf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFAF8" />
      <stop offset="50%" stop-color="#FBD3DD" />
      <stop offset="100%" stop-color="#F6E0D2" />
    </linearGradient>
    <linearGradient id="cat-pf-cookie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="50%" stop-color="#FCE1A4" />
      <stop offset="100%" stop-color="#E5AA52" />
    </linearGradient>
    <filter id="cat-pf-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#880E4F" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#cat-pf-bg)" />

  <g filter="url(#cat-pf-shadow)" transform="translate(300, 275)">
    <!-- Scalloped Plate -->
    <circle cx="0" cy="0" r="210" fill="#FFFFFF" stroke="#FED7E7" stroke-width="4" />
    <circle cx="0" cy="0" r="198" fill="#FFFDF8" stroke="#E8A33D" stroke-width="1.5" stroke-dasharray="6 4" />

    <!-- Center Sablé with Heart Cutout -->
    <circle cx="0" cy="-35" r="50" fill="url(#cat-pf-cookie)" stroke="#D7A15C" stroke-width="2" />
    <path d="M0,-25 C-20,-45 -25,-60 -10,-68 C0,-70 0,-58 0,-58 C0,-58 0,-70 10,-68 C25,-60 20,-45 0,-25 Z" fill="#D72D58" />

    <!-- Star Piped Petit Four (Left) -->
    <g transform="translate(-85, 45)">
      <path d="M0,-36 L11,-11 L36,-6 L18,12 L22,36 L0,24 L-22,36 L-18,12 L-36,-6 L-11,-11 Z" fill="url(#cat-pf-cookie)" stroke="#D7A15C" stroke-width="1.5" />
      <circle cx="0" cy="0" r="12" fill="#FFA000" />
    </g>

    <!-- Star Piped Petit Four (Right) -->
    <g transform="translate(85, 45)">
      <path d="M0,-36 L11,-11 L36,-6 L18,12 L22,36 L0,24 L-22,36 L-18,12 L-36,-6 L-11,-11 Z" fill="url(#cat-pf-cookie)" stroke="#D7A15C" stroke-width="1.5" />
      <circle cx="0" cy="0" r="12" fill="#D72D58" />
    </g>

    <!-- Sparkles -->
    <path d="M-130,-90 Q-130,-100 -140,-100 Q-130,-100 -130,-110 Q-130,-100 -120,-100 Q-130,-100 -130,-90 Z" fill="#E8A33D" />
    <path d="M130,-80 Q130,-88 122,-88 Q130,-88 130,-96 Q130,-88 138,-88 Q130,-88 130,-80 Z" fill="#E8A33D" />
  </g>

  <!-- Bottom Brand Pill -->
  <g transform="translate(300, 520)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#FFFFFF" stroke="#FED7E7" stroke-width="2" filter="url(#cat-pf-shadow)" />
    <circle cx="-105" cy="0" r="14" fill="#A31D56" />
    <path d="M-109,-4 L-101,0 L-109,4 Z" fill="#FFFFFF" />
    <text x="-80" y="6" font-family="'El Messiri', 'IBM Plex Sans Arabic', sans-serif" font-weight="700" font-size="16" fill="#A31D56">كاندي لوز</text>
    <text x="5" y="5" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="600" font-size="12" fill="#E8A33D">بيتيفور وسابليه فاخر</text>
  </g>
</svg>