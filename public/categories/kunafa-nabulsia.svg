<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <title>كنافة وحلويات نابلسية - كاندي لوز</title>
  <defs>
    <linearGradient id="cat-kn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFAF8" />
      <stop offset="50%" stop-color="#FBECC8" />
      <stop offset="100%" stop-color="#F6E0D2" />
    </linearGradient>
    <linearGradient id="cat-kn-pan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E59866" />
      <stop offset="50%" stop-color="#BA4A00" />
      <stop offset="100%" stop-color="#6E2C00" />
    </linearGradient>
    <linearGradient id="cat-kn-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D" />
      <stop offset="40%" stop-color="#FB8C00" />
      <stop offset="80%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#A02704" />
    </linearGradient>
    <filter id="cat-kn-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#873600" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#cat-kn-bg)" />

  <g filter="url(#cat-kn-shadow)" transform="translate(300, 275)">
    <!-- Round Seder Pan -->
    <circle cx="0" cy="0" r="210" fill="url(#cat-kn-pan)" />
    <circle cx="0" cy="0" r="198" fill="#FFFDF8" />
    <circle cx="0" cy="0" r="190" fill="url(#cat-kn-gold)" />

    <!-- Vermicelli Texture -->
    <g stroke="#FFE082" stroke-width="2.5" fill="none" opacity="0.65">
      <path d="M-130,-50 Q-60,-90 0,-60 Q60,-30 120,-65" />
      <path d="M-140,10 Q-80,40 -20,0 Q40,-40 100,0 Q140,30 150,10" />
      <path d="M-120,60 Q-60,30 0,70 Q60,90 120,55" />
    </g>

    <!-- Pistachio Ring & Center -->
    <circle cx="0" cy="0" r="48" fill="#388E3C" stroke="#1B5E20" stroke-width="2" />
    <circle cx="0" cy="0" r="42" fill="#81C784" />
    <circle cx="0" cy="0" r="20" fill="#2E7D32" />

    <!-- Melted Cheese Highlight Stretch -->
    <path d="M-30,-20 Q20,-70 60,-110 Q70,-60 40,-10 Z" fill="#FFFFFF" stroke="#FFE082" stroke-width="1.5" />

    <!-- Sparkles -->
    <path d="M-130,-100 Q-130,-110 -140,-110 Q-130,-110 -130,-120 Q-130,-110 -120,-110 Q-130,-110 -130,-100 Z" fill="#FFE082" />
    <path d="M130,-90 Q130,-98 122,-98 Q130,-98 130,-106 Q130,-98 138,-98 Q130,-98 130,-90 Z" fill="#FFE082" />
  </g>

  <!-- Bottom Brand Pill -->
  <g transform="translate(300, 520)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#FFFFFF" stroke="#FED7E7" stroke-width="2" filter="url(#cat-kn-shadow)" />
    <circle cx="-105" cy="0" r="14" fill="#A31D56" />
    <path d="M-109,-4 L-101,0 L-109,4 Z" fill="#FFFFFF" />
    <text x="-80" y="6" font-family="'El Messiri', 'IBM Plex Sans Arabic', sans-serif" font-weight="700" font-size="16" fill="#A31D56">كاندي لوز</text>
    <text x="5" y="5" font-family="'IBM Plex Sans Arabic', sans-serif" font-weight="600" font-size="12" fill="#E8A33D">كنافة وحلويات نابلسية</text>
  </g>
</svg>