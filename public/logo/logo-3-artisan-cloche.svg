<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cloche-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE192" />
      <stop offset="35%" stop-color="#E8A33D" />
      <stop offset="100%" stop-color="#C57E19" />
    </linearGradient>

    <linearGradient id="cloche-berry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A31D56" />
      <stop offset="100%" stop-color="#851645" />
    </linearGradient>

    <linearGradient id="cloche-tray" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A31D56" />
      <stop offset="50%" stop-color="#D94178" />
      <stop offset="100%" stop-color="#851645" />
    </linearGradient>

    <filter id="cloche-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#851645" flood-opacity="0.15" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap');
      .cloche-ar {
        font-family: 'El Messiri', var(--font-heading, 'El Messiri'), serif;
        font-weight: 700;
      }
      .cloche-sub {
        font-family: 'IBM Plex Sans Arabic', var(--font-body, 'IBM Plex Sans Arabic'), sans-serif;
      }
    </style>
  </defs>

  <!-- ================= ARTISAN CLOCHE ICON (RTL Right side: x=555, y=110) ================= -->
  <g transform="translate(555, 110)" filter="url(#cloche-shadow)">
    <!-- Soft circular backdrop pill -->
    <circle r="68" fill="#FFF5F8" stroke="#FED7E7" stroke-width="1.5" />
    <circle r="62" fill="none" stroke="#E6DED8" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Cloche Handle / Knob (Gold with Berry Pearl) -->
    <circle cx="0" cy="-42" r="7.5" fill="url(#cloche-gold)" />
    <circle cx="0" cy="-42" r="4" fill="#A31D56" />
    <path d="M-3,-35 L3,-35 L4,-28 L-4,-28 Z" fill="url(#cloche-gold)" />

    <!-- Cloche Bell / Dome Structure -->
    <path d="M-44,12 C-44,-22 -26,-28 0,-28 C26,-28 44,-22 44,12 Z" 
          fill="url(#cloche-gold)" opacity="0.95" />
    
    <!-- Light Reflection on Dome -->
    <path d="M-36,8 C-36,-16 -20,-22 0,-22 C-14,-22 -28,-14 -30,8 Z" 
          fill="#FFF9E6" opacity="0.6" />

    <!-- Gourmet Pastry & Almond Core (Visible under lifting rim) -->
    <!-- Swirling Cream & Almond Nut inside cloche -->
    <path d="M-28,12 C-18,2 18,2 28,12 L32,16 C18,19 -18,19 -32,16 Z" fill="#851645" />
    <!-- Three Almond Petals on the Platter -->
    <ellipse cx="-12" cy="7" rx="6" ry="10" transform="rotate(-30 -12 7)" fill="#FFF2E0" stroke="#E8A33D" stroke-width="1" />
    <ellipse cx="0" cy="4" rx="6" ry="11" fill="#FFF8F2" stroke="#E8A33D" stroke-width="1.2" />
    <ellipse cx="12" cy="7" rx="6" ry="10" transform="rotate(30 12 7)" fill="#FFF2E0" stroke="#E8A33D" stroke-width="1" />

    <!-- Base Serving Platter / Tray -->
    <path d="M-52,18 L52,18 C56,18 58,22 54,25 L46,28 C28,32 -28,32 -46,28 L-54,25 C-58,22 -56,18 -52,18 Z" 
          fill="url(#cloche-tray)" />
    <!-- Platter Rim Highlight -->
    <line x1="-48" y1="20" x2="48" y2="20" stroke="#FED7E7" stroke-width="1.5" stroke-linecap="round" />

    <!-- Tray Foot Stand -->
    <path d="M-20,30 L20,30 L14,38 L-14,38 Z" fill="url(#cloche-berry)" />
    <circle cx="0" cy="38" r="18" fill="url(#cloche-berry)" />

    <!-- Pastry Aroma Whispers & Sparkles -->
    <path d="M-38,-20 Q-46,-32 -40,-40" stroke="#E8A33D" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M38,-16 Q46,-28 40,-38" stroke="#E8A33D" stroke-width="2" stroke-linecap="round" fill="none" />
    <circle cx="-40" cy="-42" r="2.5" fill="#E8A33D" />
    <circle cx="40" cy="-40" r="2.5" fill="#E8A33D" />
  </g>

  <!-- ================= TYPOGRAPHY & BRAND TEXT (RTL Left side) ================= -->
  <!-- Tagline Banner -->
  <g transform="translate(450, 48)">
    <text x="0" y="0" text-anchor="end" class="cloche-sub" font-size="12" font-weight="600" fill="#A31D56" letter-spacing="1">
      صُنّاع الحلويات الشرقية والغربية • SINCE 2024
    </text>
  </g>

  <!-- Main Arabic Title: كاندي لوز -->
  <g transform="translate(450, 116)">
    <text x="0" y="0" text-anchor="end" class="cloche-ar" font-size="54" fill="#A31D56">
      كاندي <tspan fill="#E8A33D">لوز</tspan>
    </text>

    <!-- Pastry Floral Flourish over text -->
    <circle cx="-135" cy="-54" r="4" fill="#A31D56" />
    <circle cx="-146" cy="-54" r="4" fill="#A31D56" />
    <path d="M-10,-50 C-10,-60 -2,-62 0,-52" stroke="#E8A33D" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Ornamental Bar with Ribbon Knot -->
  <g transform="translate(450, 142)">
    <line x1="0" y1="0" x2="-390" y2="0" stroke="#E6DED8" stroke-width="1.2" />
    <line x1="-90" y1="0" x2="-260" y2="0" stroke="#A31D56" stroke-width="2" />
    <!-- Center Cloche Silhouette Mini Icon in divider -->
    <path d="M-175,0 C-175,-5 -170,-8 -165,-8 C-160,-8 -155,-5 -155,0 Z" fill="#E8A33D" />
    <circle cx="-165" cy="-10" r="1.5" fill="#A31D56" />
  </g>

  <!-- Subtitle Text -->
  <g transform="translate(450, 172)">
    <text x="0" y="0" text-anchor="end" class="cloche-sub" font-size="15" font-weight="700" fill="#2B1A10" letter-spacing="3">
      CANDY LOZ
    </text>
    <text x="-160" y="0" text-anchor="end" class="cloche-sub" font-size="13" font-weight="500" fill="#6B5D55" letter-spacing="1">
      ARTISAN SWEETS &amp; PATISSERIE
    </text>
  </g>
</svg>
