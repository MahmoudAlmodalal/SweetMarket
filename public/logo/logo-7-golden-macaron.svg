<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="mac-berry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C22367" />
      <stop offset="60%" stop-color="#A31D56" />
      <stop offset="100%" stop-color="#800A40" />
    </linearGradient>

    <linearGradient id="mac-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE192" />
      <stop offset="50%" stop-color="#E8A33D" />
      <stop offset="100%" stop-color="#C57E19" />
    </linearGradient>

    <filter id="mac-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#A31D56" flood-opacity="0.15" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap');
      .mac-ar {
        font-family: 'El Messiri', var(--font-heading, 'El Messiri'), sans-serif;
        font-weight: 700;
      }
      .mac-meta {
        font-family: 'IBM Plex Sans Arabic', var(--font-body, 'IBM Plex Sans Arabic'), sans-serif;
      }
    </style>
  </defs>

  <!-- ================= GOLDEN MACARON ICON (RTL Right side: x=555, y=110) ================= -->
  <g transform="translate(555, 110)" filter="url(#mac-shadow)">
    <!-- Soft circular backdrop -->
    <circle r="65" fill="#FFF5F8" stroke="#FED7E7" stroke-width="1.5" />

    <!-- Top Macaron Dome Shell (Berry Gradient) -->
    <path d="M-40,-6 C-40,-32 40,-32 40,-6 C40,-1 -40,-1 -40,-6 Z" fill="url(#mac-berry)" />
    <!-- Top Shell Frilly Foot (Pied) -->
    <ellipse cx="0" cy="-3" rx="42" ry="4.5" fill="#851645" />

    <!-- Golden Almond Ganache / Cream Filling (Center Layer) -->
    <rect x="-36" y="-2" width="72" height="10" rx="4" fill="url(#mac-gold)" />
    <circle cx="-16" cy="3" r="2.5" fill="#FFF8EE" />
    <circle cx="16" cy="3" r="2" fill="#FFF8EE" />

    <!-- Bottom Macaron Shell (Blush Rose / Warm Berry) -->
    <ellipse cx="0" cy="11" rx="42" ry="4.5" fill="#D94178" />
    <path d="M-40,11 C-40,32 40,32 40,11 Z" fill="#FED7E7" stroke="#A31D56" stroke-width="1.2" />

    <!-- Sparkle Stars -->
    <path d="M34,-24 Q34,-32 26,-32 Q34,-32 34,-40 Q34,-32 42,-32 Q34,-32 34,-24 Z" fill="url(#mac-gold)" />
    <circle cx="-32" cy="28" r="3" fill="#E8A33D" />
  </g>

  <!-- ================= TYPOGRAPHY & BRAND TEXT (RTL Left side - Simple & Clean) ================= -->
  <!-- Main Arabic Title: كاندي لوز -->
  <g transform="translate(450, 102)">
    <text x="0" y="0" text-anchor="end" class="mac-ar" font-size="58" fill="#A31D56">
      كاندي <tspan fill="#E8A33D">لوز</tspan>
    </text>

    <!-- Almond Accent Dot -->
    <circle cx="-146" cy="-56" r="4.5" fill="url(#mac-gold)" />
    <circle cx="-158" cy="-56" r="4.5" fill="url(#mac-gold)" />
  </g>

  <!-- Clean Minimalist Divider -->
  <g transform="translate(450, 132)">
    <line x1="0" y1="0" x2="-390" y2="0" stroke="#E6DED8" stroke-width="1.5" />
    <line x1="-100" y1="0" x2="-260" y2="0" stroke="url(#mac-gold)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Subtitle Text -->
  <g transform="translate(450, 168)">
    <text x="0" y="0" text-anchor="end" class="mac-meta" font-size="18" font-weight="700" fill="#2B1A10" letter-spacing="3.5">
      CANDY LOZ
    </text>
    <text x="-175" y="0" text-anchor="end" class="mac-meta" font-size="14" font-weight="500" fill="#6B5D55" letter-spacing="1.5">
      PATISSERIE • ماكرون وحلويات فاخرة
    </text>
  </g>
</svg>
