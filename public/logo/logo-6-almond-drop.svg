<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="drop-berry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C22367" />
      <stop offset="60%" stop-color="#A31D56" />
      <stop offset="100%" stop-color="#800A40" />
    </linearGradient>

    <linearGradient id="drop-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE192" />
      <stop offset="60%" stop-color="#E8A33D" />
      <stop offset="100%" stop-color="#C57E19" />
    </linearGradient>

    <filter id="drop-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#A31D56" flood-opacity="0.14" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap');
      .drop-ar {
        font-family: 'El Messiri', var(--font-heading, 'El Messiri'), sans-serif;
        font-weight: 700;
      }
      .drop-meta {
        font-family: 'IBM Plex Sans Arabic', var(--font-body, 'IBM Plex Sans Arabic'), sans-serif;
      }
    </style>
  </defs>

  <!-- ================= ALMOND & HONEY DROP ICON (RTL Right side: x=555, y=110) ================= -->
  <g transform="translate(555, 110)" filter="url(#drop-shadow)">
    <!-- Soft circular backdrop -->
    <circle r="65" fill="#FFF5F8" stroke="#FED7E7" stroke-width="1.5" />

    <!-- Outer Swirling Berry Teardrop (Melted Sweet Chocolate / Berry Glaze) -->
    <path d="M0,-48 C28,-22 42,4 32,32 C22,54 -14,56 -32,36 C-46,18 -36,-14 0,-48 Z" 
          fill="url(#drop-berry)" />

    <!-- Inner Golden Almond Nut Silhouette -->
    <path d="M-2,-26 C16,-8 22,12 12,28 C4,40 -16,38 -20,24 C-24,10 -16,-6 -2,-26 Z" 
          fill="url(#drop-amber)" />

    <!-- Almond Core Cream Texture (Ivory highlight) -->
    <path d="M-2,-14 C8,0 12,14 4,22 C-2,28 -12,26 -14,16 C-16,8 -10,-2 -2,-14 Z" 
          fill="#FFFBF8" opacity="0.9" />

    <!-- Sparkling Golden Sweet Accent -->
    <path d="M28,-22 Q28,-30 20,-30 Q28,-30 28,-38 Q28,-30 36,-30 Q28,-30 28,-22 Z" fill="url(#drop-amber)" />
    <circle cx="-28" cy="28" r="3" fill="#E8A33D" />
  </g>

  <!-- ================= TYPOGRAPHY & BRAND TEXT (RTL Left side - Simple & Minimal) ================= -->
  <!-- Main Arabic Title: كاندي لوز -->
  <g transform="translate(450, 102)">
    <text x="0" y="0" text-anchor="end" class="drop-ar" font-size="58" fill="#A31D56">
      كاندي <tspan fill="#E8A33D">لوز</tspan>
    </text>

    <!-- Simple almond accent dot -->
    <ellipse cx="-225" cy="-52" rx="4.5" ry="6.5" transform="rotate(-25 -225 -52)" fill="url(#drop-amber)" />
  </g>

  <!-- Clean Minimalist Divider -->
  <g transform="translate(450, 132)">
    <line x1="0" y1="0" x2="-390" y2="0" stroke="#E6DED8" stroke-width="1.5" />
    <line x1="-120" y1="0" x2="-260" y2="0" stroke="url(#drop-amber)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Subtitle Text -->
  <g transform="translate(450, 168)">
    <text x="0" y="0" text-anchor="end" class="drop-meta" font-size="18" font-weight="700" fill="#2B1A10" letter-spacing="3.5">
      CANDY LOZ
    </text>
    <text x="-175" y="0" text-anchor="end" class="drop-meta" font-size="14" font-weight="500" fill="#6B5D55" letter-spacing="1.5">
      FINE SWEETS • حلويات ومذاق فاخر
    </text>
  </g>
</svg>
