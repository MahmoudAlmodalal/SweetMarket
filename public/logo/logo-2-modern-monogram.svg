<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="100%" height="100%" fill="none">
  <defs>
    <!-- Modern Gradient System from tokens.css -->
    <linearGradient id="mono-berry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A31D56" />
      <stop offset="60%" stop-color="#8E1446" />
      <stop offset="100%" stop-color="#6F0C34" />
    </linearGradient>

    <linearGradient id="mono-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8A33D" />
      <stop offset="100%" stop-color="#F9C66B" />
    </linearGradient>

    <linearGradient id="mono-soft-pill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF5F8" />
    </linearGradient>

    <filter id="mono-card-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#A31D56" flood-opacity="0.12" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap');
      .mono-ar {
        font-family: 'El Messiri', var(--font-heading, 'El Messiri'), sans-serif;
        font-weight: 700;
      }
      .mono-sans {
        font-family: 'IBM Plex Sans Arabic', var(--font-body, 'IBM Plex Sans Arabic'), sans-serif;
      }
    </style>
  </defs>

  <!-- ================= MODERN MONOGRAM ICON (RTL Right side: x=555, y=110) ================= -->
  <g transform="translate(555, 110)" filter="url(#mono-card-shadow)">
    <!-- Squircle Card Background (Radius 24px) -->
    <rect x="-65" y="-65" width="130" height="130" rx="28" fill="url(#mono-soft-pill)" stroke="#FED7E7" stroke-width="2" />
    
    <!-- Outer Glow Ring Fragment -->
    <path d="M-45,-65 L35,-65 A28,28 0 0,1 65,-35 L65,15" stroke="url(#mono-accent)" stroke-width="3" stroke-linecap="round" fill="none" />
    
    <!-- Modern Geometric Sweet Almond & Candy Monogram -->
    <!-- Interlocking Berry Arc (Representing 'كاندي' & Candy Wrapper) -->
    <path d="M-28,-26 C-10,-42 25,-38 38,-16 C48,2 38,28 14,38 C-8,46 -36,34 -40,12" 
          stroke="url(#mono-berry)" stroke-width="11" stroke-linecap="round" fill="none" />

    <!-- Golden Almond Teardrop Seed (Center Nestled) -->
    <path d="M-4,-24 C14,-10 18,12 5,26 C-5,36 -20,28 -18,10 C-16,-4 -12,-18 -4,-24 Z" 
          fill="url(#mono-accent)" />

    <!-- Inner Almond Core Highlight (Ivory) -->
    <path d="M-5,-10 C4,-2 6,10 0,16 C-4,20 -11,16 -10,6 C-9,-2 -8,-8 -5,-10 Z" 
          fill="#FFFBF8" opacity="0.9" />

    <!-- Modern Ribbon Twist Finial (Berry Dot & Golden Sparkle) -->
    <circle cx="-28" cy="-25" r="5.5" fill="#A31D56" />
    <circle cx="28" cy="22" r="4.5" fill="url(#mono-accent)" />

    <!-- Minimal Star Sparkle on top-right corner -->
    <path d="M42,-42 Q42,-48 36,-48 Q42,-48 42,-54 Q42,-48 48,-48 Q42,-48 42,-42 Z" fill="#E8A33D" />
  </g>

  <!-- ================= TYPOGRAPHY & BRAND TEXT (RTL Left side) ================= -->
  <!-- Top Category Chip -->
  <g transform="translate(450, 48)">
    <text x="0" y="0" text-anchor="end" class="mono-sans" font-size="12" font-weight="600" fill="#E8A33D" letter-spacing="1">
      ✦ بوتيك الحلويات العصرية • HAUTE CONFECTIONERY
    </text>
  </g>

  <!-- Main Arabic Title: كاندي لوز -->
  <g transform="translate(450, 114)">
    <text x="0" y="0" text-anchor="end" class="mono-ar" font-size="52" fill="#2B1A10" letter-spacing="-0.5">
      كاندي <tspan fill="#A31D56">لوز</tspan>
    </text>
    
    <!-- Minimalist Almond Dot accent above Loz 'ز' -->
    <ellipse cx="-202" cy="-48" rx="5" ry="7" transform="rotate(-25 -202 -48)" fill="url(#mono-accent)" />
  </g>

  <!-- Clean Minimalist Divider -->
  <g transform="translate(450, 138)">
    <rect x="-380" y="0" width="380" height="2" fill="#FDF2F4" rx="1" />
    <rect x="-140" y="0" width="140" height="2" fill="url(#mono-berry)" rx="1" />
  </g>

  <!-- Latin Typography & Details -->
  <g transform="translate(450, 172)">
    <text x="0" y="0" text-anchor="end" class="mono-sans" font-size="16" font-weight="700" fill="#A31D56" letter-spacing="4">
      CANDY LOZ
    </text>
    <text x="-165" y="0" text-anchor="end" class="mono-sans" font-size="12" font-weight="500" fill="#6B5D55" letter-spacing="2">
      SWEETS &amp; DELIGHTS • EST. GAZA
    </text>
  </g>
</svg>
